[project]
name = "call_me_sdk"
version = "1.0.0"
description = "LLM SDK for local model inference"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
    "pydantic>=2.13.5",
    "numpy>=2.2.6",
    "regex>=2026.1.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_sdk"]

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]

[tool.mypy]
exclude = ["^llm_sdk/"]
